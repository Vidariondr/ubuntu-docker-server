services:
  gluetun-slskd:
    networks:
      docker_network:
        ipv4_address: ${IP_GLUETUN_SLSKD}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped 
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun_slskd
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "${SLSKD_PORT}:${SLSKD_PORT}"
    volumes:
      - '${DOCKERDIR}/appdata/gluetun_slskd:/gluetun'
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_SLSKD_WG_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${GLUETUN_SLSKD_WG_ADDRESSES}
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      SERVER_COUNTRIES: "Switzerland,Netherlands,Sweden"
      BLOCK_MALICIOUS: "on"
      HEALTH_VPN_DURATION_INITIAL: "30s"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_SLSKD_KEY}"}'
