services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.8.1
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - "${DOCKERDIR}/appdata/homeassistant:/config"
      - "/etc/localtime:/etc/localtime:ro"
      - "/run/dbus:/run/dbus:ro"
    environment:
      - TZ=${TZ}
