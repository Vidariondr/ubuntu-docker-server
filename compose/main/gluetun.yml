services:
  gluetun:
    networks:
      docker_network:
        ipv4_address: ${IP_GLUETUN}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped 
    image: qmcgaw/gluetun:v3.41
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "${GLUETUN_PORT}:${GLUETUN_PORT}"
      - "${SABNZBD_EXT_PORT}:${SABNZBD_INT_PORT}"
      - "${PROWLARR_PORT}:${PROWLARR_PORT}"
      - "${TA_PORT}:${TA_PORT}"
      - "${TA_ES_PORT}:${TA_ES_PORT}"
      - "${METUBE_PORT}:${METUBE_PORT}"
      - "${SOULSYNC_PORT}:${SOULSYNC_PORT}"
      - "${SUWAYOMI_PORT}:${SUWAYOMI_PORT}"
      - "${FLARESOLVERR_PORT}:${FLARESOLVERR_PORT}"
    volumes:
      - '${DOCKERDIR}/appdata/gluetun:/gluetun'
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_WG_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${GLUETUN_WG_ADDRESSES}
      PORT_FORWARD_ONLY: on
      VPN_PORT_FORWARDING: on
      SERVER_COUNTRIES: "Switzerland,Netherlands,Sweden"
      BLOCK_MALICIOUS: on
      HEALTH_VPN_DURATION_INITIAL: "30s"
        #      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
