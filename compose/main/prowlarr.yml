services:
  prowlarr:
    image: linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: "service:gluetun"
    volumes:
      - '${DOCKERDIR}/appdata/prowlarr:/config'
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
