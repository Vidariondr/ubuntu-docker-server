services:
  soulsync:
    image: boulderbadgedad/soulsync:3.2.2
    container_name: soulsync
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: "022"
      PYTHONPATH: /app
      TZ: ${TZ}
    volumes:
      - "${DOCKERDIR}/appdata/soulsync/config:/app/config"
      - "soulsync_database:/app/data"
      - "${DOCKERDIR}/appdata/soulsync/logs:/app/logs"
      - "${DOCKERDIR}/appdata/soulsync/Staging:/app/Staging"
      - "${DOCKERDIR}/appdata/soulsync/scripts:/app/scripts"
      - "${DATADIR}/data/media/soulsync/downloads:/app/downloads"
      - "${DATADIR}/data/media/soulsync/MusicVideos:/app/MusicVideos"
      - "${DATADIR}/data/media/music:/app/Transfer"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SOULSYNC_PORT}/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
volumes:
  soulsync_database:
    driver: local
