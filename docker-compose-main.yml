######################## NETWORKS
networks:
  default:
    driver: bridge

  docker_network:
    name: docker_network
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_DOCKER}

  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_PROXY}

######################## INCLUDES
include:
  # --- Core / Infrastructure ---
  - compose/main/arcane.yaml
  - compose/main/socket-proxy.yml
  - compose/main/dozzle.yml
  - compose/main/homepage.yml
  - compose/main/apprise-api.yml
